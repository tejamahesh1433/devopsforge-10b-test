image:
  repository: fastapi-app
  tag: "v4"
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  enabled: true
  type: ClusterIP
  port: 8000

health:
  enabled: true
  path: /healthz

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: example.local

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
